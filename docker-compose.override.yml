# Geliştirme ortamı override'ları
# docker compose up komutu bu dosyayı otomatik algılar
services:
  ai-service:
    build:
      target: development
    volumes:
      - ./ai-service:/app
      - ./ai-service/weights:/app/weights
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  backend:
    build:
      target: development
